
name: QA Automation Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bdd-tests:
    name: BDD Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run BDD tests
        run: |
          mkdir -p reports/bdd
          npm run test:bdd

      - name: Upload BDD results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bdd-results
          path: reports/bdd/
          if-no-files-found: warn

  web-tests:
    name: Web Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Web tests
        run: |
          mkdir -p reports
          npm run test:web

      - name: Upload Web results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: web-results
          path: reports/cucumber-web-report.json
          if-no-files-found: warn

  api-tests:
    name: API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: |
          mkdir -p reports
          npm run test:api

      - name: Upload API results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: api-results
          path: reports/cucumber-api-report.json
          if-no-files-found: warn

  playwright-tests:
    name: Playwright Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npm run test:playwright

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn

  report:
    name: Generate Final Report
    runs-on: ubuntu-latest
    needs:
      - bdd-tests
      - web-tests
      - api-tests
      - playwright-tests
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download BDD results
        uses: actions/download-artifact@v6
        with:
          name: bdd-results
          path: reports/bdd
        continue-on-error: true

      - name: Download Web results
        uses: actions/download-artifact@v6
        with:
          name: web-results
          path: reports/web
        continue-on-error: true

      - name: Download API results
        uses: actions/download-artifact@v6
        with:
          name: api-results
          path: reports/api
        continue-on-error: true

      - name: Download Playwright results
        uses: actions/download-artifact@v6
        with:
          name: playwright-results
          path: reports/playwright
        continue-on-error: true

      - name: Generate BDD HTML report
        run: npm run report

      - name: Upload consolidated results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: qa-automation-final-report
          path: reports/
          if-no-files-found: warn
          retention-days: 15
