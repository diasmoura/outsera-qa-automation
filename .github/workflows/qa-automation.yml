
name: QA Automation - CI/CD

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  qa-automation:
    name: Execute QA Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create report directories
        run: |
          mkdir -p reports/bdd
          mkdir -p reports/html

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Execute BDD tests
        id: bdd
        continue-on-error: true
        run: npm run test:bdd

      - name: Execute Playwright tests
        id: playwright
        continue-on-error: true
        run: npm run test:playwright

      - name: Generate HTML report
        if: always()
        continue-on-error: true
        run: npm run report

      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-automation-reports
          path: |
            reports/
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 15

      - name: Validate test results
        if: always()
        run: |
          if [ "${{ steps.bdd.outcome }}" != "success" ] || [ "${{ steps.playwright.outcome }}" != "success" ]; then
            echo "Falha na execução dos testes QA."
            exit 1
          fi

          echo "Todos os testes foram aprovados!"
