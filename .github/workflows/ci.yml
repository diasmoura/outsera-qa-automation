name: QA Automation - CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # STATIC QUALITY GATE
  # ==========================================

  quality-gate:
    name: Static Quality Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run NPM Audit
        run: npm run audit

  # ==========================================
  # WEB BDD TESTS - CROSS BROWSER
  # ==========================================

  web-tests:
    name: Web BDD Tests - Cross Browser
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs:
      - quality-gate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create report directories
        run: |
          mkdir -p reports/web
          mkdir -p reports/evidences

      - name: Validate required test credentials
        env:
          QA_LOGIN_EMAIL: ${{ secrets.QA_LOGIN_EMAIL }}
          QA_LOGIN_PASSWORD: ${{ secrets.QA_LOGIN_PASSWORD }}
          QA_CARD_NAME: ${{ secrets.QA_CARD_NAME }}
          QA_CARD_NUMBER: ${{ secrets.QA_CARD_NUMBER }}
          QA_CARD_CVC: ${{ secrets.QA_CARD_CVC }}
          QA_CARD_EXPIRY_MONTH: ${{ vars.QA_CARD_EXPIRY_MONTH }}
          QA_CARD_EXPIRY_YEAR: ${{ vars.QA_CARD_EXPIRY_YEAR }}
        shell: bash
        run: |
          required_vars=(
            QA_LOGIN_EMAIL
            QA_LOGIN_PASSWORD
            QA_CARD_NAME
            QA_CARD_NUMBER
            QA_CARD_CVC
            QA_CARD_EXPIRY_MONTH
            QA_CARD_EXPIRY_YEAR
          )

          for variable in "${required_vars[@]}"; do
            if [ -z "${!variable}" ]; then
              echo "::error::A configuração $variable não foi definida no GitHub Secrets/Variables."
              exit 1
            fi
          done

          echo "Configurações de teste validadas."

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run Web BDD tests
        env:
          QA_LOGIN_EMAIL: ${{ secrets.QA_LOGIN_EMAIL }}
          QA_LOGIN_PASSWORD: ${{ secrets.QA_LOGIN_PASSWORD }}
          QA_CARD_NAME: ${{ secrets.QA_CARD_NAME }}
          QA_CARD_NUMBER: ${{ secrets.QA_CARD_NUMBER }}
          QA_CARD_CVC: ${{ secrets.QA_CARD_CVC }}
          QA_CARD_EXPIRY_MONTH: ${{ vars.QA_CARD_EXPIRY_MONTH }}
          QA_CARD_EXPIRY_YEAR: ${{ vars.QA_CARD_EXPIRY_YEAR }}
        run: npm run test:web:cross

      - name: Upload Web results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-results
          path: |
            reports/web/chromium-report.json
            reports/web/firefox-report.json
            reports/web/webkit-report.json
            reports/evidences/
          if-no-files-found: warn
          retention-days: 15

  # ==========================================
  # API BDD TESTS
  # ==========================================

  api-tests:
    name: API BDD Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
      - quality-gate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create report directories
        run: mkdir -p reports/api

      - name: Run API BDD tests
        run: npm run test:api

      - name: Upload API results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-results
          path: reports/api/cucumber-api-report.json
          if-no-files-found: warn
          retention-days: 15

  # ==========================================
  # PLAYWRIGHT TESTS
  # ==========================================

  playwright-tests:
    name: Playwright Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
      - quality-gate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create report directories
        run: |
          mkdir -p playwright-report
          mkdir -p test-results

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run Playwright tests
        run: npm run test:playwright

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 15

  # ==========================================
  # PERFORMANCE TESTS - K6 SMOKE
  # ==========================================

  performance-tests:
    name: Performance Smoke Test (K6)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs:
      - quality-gate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install K6
        uses: grafana/setup-k6-action@v1

      - name: Create performance report directories
        run: |
          mkdir -p reports/performance/history/smoke

      - name: Start local API
        run: |
          nohup node performance/server.js > /tmp/qa-api.log 2>&1 &

      - name: Wait for API
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --silent --fail http://localhost:3000/health; then
              echo "API disponível."
              exit 0
            fi

            echo "Aguardando API... tentativa $attempt"
            sleep 2
          done

          echo "A API não iniciou corretamente."
          cat /tmp/qa-api.log
          exit 1

      - name: Run K6 Smoke Test
        env:
          BASE_URL: http://localhost:3000
        run: |
          k6 run \
            -e BASE_URL="$BASE_URL" \
            performance/smoke-test.js

      - name: Generate K6 HTML report
        if: always()
        run: |
          if [ -f reports/performance/smoke-summary.json ]; then
            node performance/report.js
          else
            echo "Resumo Smoke K6 não encontrado."
          fi

      - name: Upload K6 results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-results
          path: reports/performance/
          if-no-files-found: warn
          retention-days: 15

  # ==========================================
  # CONSOLIDATED REPORT
  # ==========================================

  report:
    name: Generate Consolidated Report
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    needs:
      - quality-gate
      - web-tests
      - api-tests
      - playwright-tests
      - performance-tests

    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create report directories
        run: |
          mkdir -p reports/web
          mkdir -p reports/api
          mkdir -p reports/performance
          mkdir -p reports/consolidated
          mkdir -p test-results
          mkdir -p playwright-report

      # --------------------------------------
      # DOWNLOAD ARTIFACTS
      # --------------------------------------

      - name: Download Web results
        if: always()
        uses: actions/download-artifact@v7
        with:
          name: web-results
          path: reports
        continue-on-error: true

      - name: Download API results
        if: always()
        uses: actions/download-artifact@v7
        with:
          name: api-results
          path: reports/api
        continue-on-error: true

      - name: Download Playwright results
        if: always()
        uses: actions/download-artifact@v7
        with:
          name: playwright-results
          path: reports/playwright
        continue-on-error: true

      - name: Download Performance results
        if: always()
        uses: actions/download-artifact@v7
        with:
          name: performance-results
          path: reports/performance
        continue-on-error: true

      # --------------------------------------
      # PREPARE DASHBOARD INPUTS
      # --------------------------------------

      - name: Prepare dashboard inputs
        if: always()
        shell: bash
        run: |
          mkdir -p reports test-results playwright-report

          if [ -f reports/playwright/test-results/playwright-results.json ]; then
            cp reports/playwright/test-results/playwright-results.json \
              test-results/playwright-results.json
          fi

          if [ -f reports/playwright/test-results/.last-run.json ]; then
            cp reports/playwright/test-results/.last-run.json \
              test-results/.last-run.json
          fi

          if [ -d reports/playwright/playwright-report ]; then
            cp -R reports/playwright/playwright-report/. \
              playwright-report/
          fi

          echo "Arquivos preparados para o dashboard:"
          find reports test-results playwright-report \
            -maxdepth 5 -type f 2>/dev/null || true

      # --------------------------------------
      # GENERATE CUCUMBER REPORT
      # --------------------------------------

      - name: Generate consolidated Web and API report
        if: always()
        shell: bash
        run: |
          if [ -f reports/web/chromium-report.json ] && \
             [ -f reports/web/firefox-report.json ] && \
             [ -f reports/web/webkit-report.json ] && \
             [ -f reports/api/cucumber-api-report.json ]; then
            node cucumber-report.js
          else
            echo "Relatórios Web e API incompletos. Consolidação ignorada."
          fi

      # --------------------------------------
      # GENERATE QA DASHBOARD
      # --------------------------------------

      - name: Generate QA dashboard
        if: always()
        run: node dashboard.js

      # --------------------------------------
      # UPLOAD FINAL REPORTS
      # --------------------------------------

      - name: Upload final reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-automation-final-report
          path: |
            reports/
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 15
