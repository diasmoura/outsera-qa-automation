
name: QA Automation Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-tests:
    name: Web BDD Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Web tests
        run: |
          mkdir -p reports
          npm run test:web

      - name: Upload Web results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: web-results
          path: |
            reports/cucumber-web-report.json
            reports/evidences/
          if-no-files-found: warn
          retention-days: 15

  api-tests:
    name: API BDD Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: |
          mkdir -p reports
          npm run test:api

      - name: Upload API results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: api-results
          path: reports/cucumber-api-report.json
          if-no-files-found: warn
          retention-days: 15

  playwright-tests:
    name: Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npm run test:playwright

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 15

  performance-tests:
    name: Performance Tests (K6)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install K6
        uses: grafana/setup-k6-action@v1

      - name: Start local API
        run: |
          mkdir -p reports/performance
          nohup node performance/server.js > /tmp/qa-api.log 2>&1 &

      - name: Wait for API
        run: |
          for attempt in {1..30}; do
            if curl --silent --fail http://localhost:3000/health; then
              echo "API disponível."
              exit 0
            fi
            echo "Aguardando API... tentativa $attempt"
            sleep 2
          done

          echo "A API não iniciou corretamente."
          cat /tmp/qa-api.log
          exit 1

      - name: Run K6 load test
        env:
          BASE_URL: http://localhost:3000
        run: k6 run performance/load-test.js

      - name: Generate K6 HTML report
        if: always()
        run: |
          if [ -f reports/performance/load-summary.json ]; then
            node performance/load-report.js
          else
            echo "Resumo K6 não encontrado."
          fi

      - name: Upload K6 results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: performance-results
          path: reports/performance/
          if-no-files-found: warn
          retention-days: 15

  report:
    name: Generate Consolidated Report
    runs-on: ubuntu-latest
    timeout-minutes: 15

    needs:
      - web-tests
      - api-tests
      - playwright-tests
      - performance-tests

    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Web results
        uses: actions/download-artifact@v6
        with:
          name: web-results
          path: reports/web
        continue-on-error: true

      - name: Download API results
        uses: actions/download-artifact@v6
        with:
          name: api-results
          path: reports/api
        continue-on-error: true

      - name: Download Playwright results
        uses: actions/download-artifact@v6
        with:
          name: playwright-results
          path: reports/playwright
        continue-on-error: true

      - name: Download Performance results
        uses: actions/download-artifact@v6
        with:
          name: performance-results
          path: reports/performance
        continue-on-error: true

      - name: Generate consolidated Web and API report
        shell: bash
        run: |
          if [ -f reports/web/cucumber-web-report.json ] || [ -f reports/api/cucumber-api-report.json ]; then
            node cucumber-report.js
          else
            echo "Nenhum relatório Cucumber disponível para consolidação."
          fi

      - name: Upload final reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: qa-automation-final-report
          path: reports/
          if-no-files-found: warn
          retention-days: 15
